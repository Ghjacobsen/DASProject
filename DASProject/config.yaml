# YOLO Hyperparameters Configuration
yolo:
  model:
    name: "yolov8n"  # yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
    pretrained: true
    device: 0  # GPU device index, -1 for CPU

  training:
    epochs: 100
    batch_size: 16
    imgsz: 640
    patience: 20
    save: true
    device: 0

  optimizer:
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005

  augmentation:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 0.0
    translate: 0.1
    scale: 0.5
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0

  data:
    dataset_path: "./data"
    train_split: 0.8
    val_split: 0.1
    test_split: 0.1

  inference:
    confidence: 0.25
    iou: 0.45