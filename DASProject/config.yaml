# config.yaml

paths:
  raw_data_path: "data/raw/train"
  inference_data_path: "data/raw/inference"
  reconstruction_path: "data/reconstructions"
  model_path: "models"
  figure_path: "reports/figures"

preprocessing:
  enable_bandpass: True
  bandpass_lowcut: 1.0  # Hz
  bandpass_highcut: 100.0 # Hz
  sampling_rate: 800 # Hz
  enable_channel_mean_subtraction: True # Removes static vertical hardware stripes

data:
  patch_size: [128, 128] # (Time, Channels) - reduced for memory efficiency
  train_val_split: 0.8
  spatial_sampling_dx: 1.02 # meters
  
hyperparameter_search:
  use_grid_search: True
  # Lists of parameters to sweep
  latent_dims: [64, 128]
  learning_rates: [0.001, 0.0001]

training:
  epochs: 20
  batch_size: 32
  patience: 5 # Early stopping
  seed: 42

visualization:
  threshold_sigma: 3.0 # Standard deviations above mean to classify as anomaly